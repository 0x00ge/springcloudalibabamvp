server:
  # demo 独立使用 8091，避免和 gateway、业务服务、rocketmq-demo 常见端口冲突。
  port: 8091

spring:
  application:
    # 应用名会出现在日志、监控和 Spring 上下文中，便于区分不同 demo。
    name: redisson-demo
  data:
    redis:
      # Redisson starter 会读取这里的 Redis Cluster 节点信息并自动创建 RedissonClient。
      # Redis Cluster 只支持 0 号库，因此不要再配置 database。
      cluster:
        nodes:
          - 127.0.0.1:7001
          - 127.0.0.1:7002
          - 127.0.0.1:7003
          - 127.0.0.1:7004
          - 127.0.0.1:7005
          - 127.0.0.1:7006
      # 连接超时时间，避免 Redis 未启动时请求长时间卡住。
      timeout: 3000ms

logging:
  level:
    # demo 包使用 DEBUG，方便观察接口调用时的日志。
    com.demo.redisson: DEBUG
    # Redisson 自身日志保持 INFO，避免输出过多底层连接细节。
    org.redisson: INFO
