# ============================================================================
# RocketMQ Broker 配置文件 - broker-group2 从节点（Slave）
# ============================================================================
#
# 角色说明：
#   - 此节点为 broker-group2 的从节点（brokerId=1）
#   - 从 broker-master2 实时同步消息
#   - 与 broker-slave1 共同为集群提供数据冗余和读服务
#
# ============================================================================


# ============================================================================
# 一、集群与节点身份配置
# ============================================================================

brokerClusterName=DefaultCluster

# 必须与 broker-master2 的 brokerName 相同
brokerName=broker-group2

brokerId=1
brokerRole=SLAVE
flushDiskType=ASYNC_FLUSH


# ============================================================================
# 二、网络配置
# ============================================================================

namesrvAddr=namesrv-1:9876;namesrv-2:9876
brokerIP1=broker-slave2

# 端口配置
# - 与 broker-master2 错开
# - Master2: 10931/10932
# - Slave2: 10941/10942（+10）
listenPort=10941
haListenPort=10942

# 连接 Master2 的 HA 端口
haMasterAddress=broker-master2:10932


# ============================================================================
# 三、Topic 和消费组自动创建
# ============================================================================

autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true


# ============================================================================
# 四、消息存储配置
# ============================================================================

deleteWhen=04
fileReservedTime=48
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog


# ============================================================================
# 集群整体架构总结
# ============================================================================
#
# 当前集群拓扑：
#
#   NameServer-1 (9876)
#        │
#        ├─── broker-group1
#        │     ├─ broker-master1 (10911/10912) [Master]
#        │     └─ broker-slave1  (10921/10922) [Slave]
#        │
#        └─── broker-group2
#              ├─ broker-master2 (10931/10932) [Master]
#              └─ broker-slave2  (10941/10942) [Slave]
#
#
# 数据流：
#   1. Producer → Master1/Master2（负载均衡写入）
#   2. Master → Slave（主从同步）
#   3. Consumer ← Master/Slave（读取，Slave 分担压力）
#
#
# 高可用：
#   - 任一 Master 宕机：该组的 Slave 继续提供读服务
#   - 任一 Slave 宕机：Master 继续提供读写服务
#   - 整个 broker-group1 宕机：broker-group2 继续工作
#
# ============================================================================
