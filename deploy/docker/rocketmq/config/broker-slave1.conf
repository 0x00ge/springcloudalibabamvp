# broker-group1 从节点（brokerId=1），从 master1 同步消息

# ── 集群 / 节点身份 ────────────────────────────────────────────────────────────
brokerClusterName=DefaultCluster
# 与 broker-master1 相同的 brokerName，表示同属一个主从组
brokerName=broker-group1
# 非 0 = slave，只读，不接受 Producer 写入
brokerId=1
# SLAVE 角色：只从 master 同步消息，可承担消费者读流量（当 master 压力大时）
brokerRole=SLAVE
flushDiskType=ASYNC_FLUSH

# ── 网络 ──────────────────────────────────────────────────────────────────────
namesrvAddr=namesrv-1:9876;namesrv-2:9876
# slave 自身的访问地址，填容器 hostname 供 Proxy 在 Docker 内网访问
brokerIP1=broker-slave1
# slave 的 Remoting 监听端口，与 master1 的 10911 错开避免宿主机端口冲突
listenPort=10921
haListenPort=10922
# slave 主动连接 master1 的 HA 端口（10912）拉取消息进行同步
haMasterAddress=broker-master1:10912

# ── Topic / SubscriptionGroup 自动创建 ───────────────────────────────────────
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# ── 消息存储 ──────────────────────────────────────────────────────────────────
deleteWhen=04
fileReservedTime=48
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
