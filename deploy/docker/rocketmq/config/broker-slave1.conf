# ============================================================================
# RocketMQ Broker 配置文件 - broker-group1 从节点（Slave）
# ============================================================================
#
# 角色说明：
#   - 此节点为 broker-group1 的从节点（brokerId=1）
#   - 从 broker-master1 实时同步消息，作为数据备份
#   - 通常只提供消息读取服务（当 Master 压力大时）
#   - Master 宕机时，Slave 可以继续提供读服务，但不接受写入
#
# ============================================================================


# ============================================================================
# 一、集群与节点身份配置
# ============================================================================

brokerClusterName=DefaultCluster

# Broker 组名称
# - 必须与 Master 的 brokerName 相同（broker-group1）
# - 这样才能组成主从复制组
brokerName=broker-group1

# Broker ID
# - 非 0 表示 Slave 节点
# - 同一主从组内，每个 Slave 的 brokerId 必须不同
# - 通常：Master=0, Slave1=1, Slave2=2...
brokerId=1

# Broker 角色
# - SLAVE：从节点，只从 Master 同步消息
# - 从节点不接受 Producer 的写入请求
# - 可以承担 Consumer 的读请求（需要 slaveReadEnable=true）
brokerRole=SLAVE

# 刷盘策略
# - Slave 同样需要将同步来的消息持久化到磁盘
# - 通常与 Master 保持一致
flushDiskType=ASYNC_FLUSH


# ============================================================================
# 二、网络配置
# ============================================================================

namesrvAddr=namesrv-1:9876

# Slave 自身的对外 IP
# - Consumer 可以通过此 IP 从 Slave 读取消息
brokerIP1=broker-slave1

# Slave 的 Remoting 监听端口
# - 必须与同环境下其他 Broker 的端口错开
# - Master1: 10911, Slave1: 10921, Master2: 10931...
listenPort=10921

# Slave 的 HA 同步端口
# - Slave 也有 HA 端口，但通常不使用（因为 Slave 不对外提供主从同步）
haListenPort=10922

# Master 的 HA 地址
# - Slave 启动后，主动连接 Master 的 HA 端口
# - 格式：<master-host>:<master-ha-port>
# - Docker 内网：使用容器名 broker-master1:10912
# - 宿主机直连：使用 127.0.0.1:10912
# - 这是 Slave 最重要的配置，连接错误会导致无法同步
haMasterAddress=broker-master1:10912


# ============================================================================
# 三、Topic 和消费组自动创建
# ============================================================================

# Slave 通常保持与 Master 一致的配置
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true


# ============================================================================
# 四、消息存储配置
# ============================================================================

# Slave 的存储配置与 Master 相同
# - Slave 会将从 Master 同步来的消息写入自己的 CommitLog
# - 保留时长、清理策略等与 Master 保持一致

deleteWhen=04
fileReservedTime=48
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog


# ============================================================================
# 五、主从同步原理
# ============================================================================
#
# 1. Slave 启动时，连接 Master 的 haMasterAddress
# 2. Slave 向 Master 报告自己的同步位点（CommitLog 偏移量）
# 3. Master 从该位点开始，将后续所有消息推送给 Slave
# 4. Slave 接收消息，写入本地 CommitLog
# 5. 同步是实时的，延迟通常在毫秒级
#
# 同步模式（由 Master 的 brokerRole 决定）：
#   - ASYNC_MASTER：异步同步，Master 不等 Slave 确认
#   - SYNC_MASTER：同步等待，Master 等所有 Slave 确认后才返回
#
# ============================================================================


# ============================================================================
# 配置检查清单
# ============================================================================
#
# 确保以下配置正确：
#   ✓ brokerName 与 Master 相同（broker-group1）
#   ✓ brokerId 非 0（通常为 1）
#   ✓ brokerRole=SLAVE
#   ✓ haMasterAddress 指向正确的 Master HA 端口
#   ✓ listenPort 不与其他 Broker 冲突
#   ✓ brokerIP1 填写正确（容器名或 IP）
#
# ============================================================================
