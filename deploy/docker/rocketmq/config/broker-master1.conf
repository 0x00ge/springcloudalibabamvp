# ============================================================================
# RocketMQ Broker 配置文件 - broker-group1 主节点（Master）
# ============================================================================
#
# 角色说明：
#   - 此节点为 broker-group1 的主节点（brokerId=0）
#   - 负责接收生产者的消息写入请求
#   - 同组的 broker-slave1 会连接本节点的 haListenPort 同步消息
#   - 支持消息读取（当 Slave 压力大时，Master 也可承担读流量）
#
# ============================================================================


# ============================================================================
# 一、集群与节点身份配置
# ============================================================================

# 集群名称
# - 所有 Broker 必须属于同一个 brokerClusterName
# - Dashboard 会按此名称分组展示集群
# - 同一集群的 Broker 可以协同工作，分担流量
brokerClusterName=DefaultCluster

# Broker 组名称
# - 同一 brokerName 下的节点构成一个主从复制组
# - 主从组内：master brokerId=0，slave brokerId 非 0
# - 不同的 brokerName 表示不同的主从组（如 broker-group1, broker-group2）
brokerName=broker-group1

# Broker ID
# - 0 = Master（主节点），负责消息的读写
# - 非 0 = Slave（从节点），从 Master 同步消息，通常只负责读
# - 同一 brokerName 下，只能有一个 brokerId=0 的节点
brokerId=0

# Broker 角色
# - ASYNC_MASTER：异步主节点
#   * Master 将消息写入内存后立即返回成功
#   * 消息异步刷盘到磁盘
#   * 消息异步同步给 Slave
#   * 优点：吞吐量高，延迟低
#   * 缺点：Master 宕机可能丢失部分未刷盘或未同步的消息
#
# - SYNC_MASTER：同步主节点
#   * 等待所有 Slave 确认收到消息后才返回成功
#   * 优点：数据可靠性高，Master 宕机后 Slave 有完整数据
#   * 缺点：延迟较高，吞吐量下降
#
# - SLAVE：从节点（在 slave 配置文件中使用）
brokerRole=ASYNC_MASTER

# 刷盘策略
# - ASYNC_FLUSH：异步刷盘
#   * 消息写入操作系统的 PageCache（内存）后立即返回
#   * 由操作系统异步将数据刷到磁盘
#   * 优点：性能好，吞吐量高
#   * 缺点：操作系统宕机时，PageCache 中未刷盘的消息会丢失
#
# - SYNC_FLUSH：同步刷盘
#   * 每条消息写入后，强制刷到磁盘才返回
#   * 优点：数据安全，即使操作系统崩溃也不丢消息
#   * 缺点：性能下降，吞吐量降低
#
# 建议：
#   - 开发环境：ASYNC_FLUSH
#   - 生产环境（对数据安全要求高）：SYNC_FLUSH
flushDiskType=ASYNC_FLUSH


# ============================================================================
# 二、网络配置
# ============================================================================

# NameServer 地址
# - Broker 启动时向 NameServer 注册自己的路由信息
# - 多个 NameServer 用分号分隔：namesrv-1:9876;namesrv-2:9876
# - Proxy 模式下，容器间通过 Docker 网络互访，使用容器名
namesrvAddr=namesrv-1:9876

# Broker 对外暴露的 IP 地址
# - brokerIP1：主要通信地址，Producer/Consumer/Proxy 通过此 IP 连接 Broker
# - 传统模式（宿主机应用直连）：填 127.0.0.1
# - Proxy 模式（Docker 内网）：填容器 hostname（broker-master1）
# - 如果不配置，RocketMQ 会自动检测本机 IP，但可能检测不准确
brokerIP1=broker-master1

# Broker Remoting 监听端口
# - Producer/Consumer/Proxy 通过此端口与 Broker 通信
# - 用于消息发送、拉取、查询等操作
# - 默认值：10911
# - 不同 Broker 组的端口应错开，避免冲突
listenPort=10911

# HA（High Availability）主从同步端口
# - Slave 连接 Master 的此端口，实时拉取消息进行主从同步
# - Master 会监听此端口，等待 Slave 连接
# - 默认值：10912（通常为 listenPort + 1）
haListenPort=10912


# ============================================================================
# 三、Topic 和消费组自动创建
# ============================================================================

# 是否允许自动创建 Topic
# - true：当 Producer 发送消息到不存在的 Topic 时，自动创建
# - false：必须手动通过 mqadmin 或 Dashboard 创建 Topic
# - 建议：
#   * 开发环境：true（方便开发调试）
#   * 生产环境：false（防止误操作，所有 Topic 应提前规划和创建）
autoCreateTopicEnable=true

# 是否允许自动创建消费组（SubscriptionGroup）
# - true：当 Consumer 订阅消息时，自动创建消费组
# - false：必须手动创建消费组
# - 建议：同 autoCreateTopicEnable
autoCreateSubscriptionGroup=true


# ============================================================================
# 四、消息存储配置
# ============================================================================

# 消息文件清理时间
# - 每天的哪个小时执行过期消息文件清理
# - 格式：00-23（24 小时制）
# - 建议：凌晨业务低峰期，如 04（凌晨 4 点）
deleteWhen=04

# 消息文件保留时长（小时）
# - 消息文件在磁盘上保留的时间，超时自动删除
# - 单位：小时
# - 72 小时 = 3 天，48 小时 = 2 天
# - 注意：即使消息未被消费，超时也会删除
# - 建议：
#   * 开发环境：48 小时（节省磁盘空间）
#   * 生产环境：72 小时或更长（根据业务需求和磁盘容量）
fileReservedTime=48

# 消息存储根目录
# - 所有消息数据文件的根目录
# - 容器内路径，通过 Docker volumes 挂载到宿主机持久化
# - 确保此目录有足够的磁盘空间（消息量大时可能占用数十 GB）
storePathRootDir=/home/rocketmq/store

# CommitLog 文件路径
# - CommitLog 是 RocketMQ 的核心存储文件
# - 所有 Topic 的消息按到达顺序写入同一个 CommitLog（顺序写，性能高）
# - 文件大小：默认 1GB，写满后创建新文件
# - ConsumeQueue 和 IndexFile 会从 CommitLog 构建索引
storePathCommitLog=/home/rocketmq/store/commitlog


# ============================================================================
# 五、其他常用配置（可选，当前未启用）
# ============================================================================

# 磁盘空间告警阈值（默认 90%）
# diskMaxUsedSpaceRatio=90
#   - 当磁盘使用率超过此值时，Broker 拒绝新消息写入
#   - 避免磁盘被写满导致系统崩溃

# 消息体大小限制（默认 4MB）
# maxMessageSize=4194304
#   - 单条消息的最大字节数
#   - 建议：根据实际业务调整，避免消息过大影响性能

# 是否启用消息轨迹（默认 false）
# traceOn=true
#   - 记录消息的生产、存储、消费全链路信息
#   - 用于问题排查和监控

# 是否启用 ACL 权限控制（默认 false）
# aclEnable=true
#   - 开启后，Producer/Consumer 需要配置 AccessKey 和 SecretKey
#   - 用于生产环境的安全控制

# Slave 读权限（当 Master 压力大时）
# slaveReadEnable=true
#   - 允许 Consumer 从 Slave 读取消息，分担 Master 压力
#   - 默认：false（所有读写都在 Master）


# ============================================================================
# 配置说明总结
# ============================================================================
#
# 本配置文件适用于：
#   - 开发环境/测试环境
#   - 单机多 Broker 部署
#   - Docker Compose + Proxy 模式
#
# 生产环境优化建议：
#   1. brokerRole=SYNC_MASTER（数据可靠性优先）
#   2. flushDiskType=SYNC_FLUSH（防止丢消息）
#   3. autoCreateTopicEnable=false（手动管理 Topic）
#   4. fileReservedTime=72（保留更长时间）
#   5. 配置 ACL 权限控制
#   6. 监控磁盘空间和消息堆积
#
# ============================================================================
