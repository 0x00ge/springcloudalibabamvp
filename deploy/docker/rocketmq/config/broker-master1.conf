# broker-group1 主节点（brokerId=0）
# 同组的 broker-slave1 会连接本节点的 haListenPort 同步消息

# ── 集群 / 节点身份 ────────────────────────────────────────────────────────────
# 所有 Broker 必须属于同一个 brokerClusterName，Dashboard 按此分组展示
brokerClusterName=DefaultCluster
# 同一 brokerName 下的节点构成一个主从组，master brokerId=0，slave brokerId 非 0
brokerName=broker-group1
# 0 = master，负责消息读写
brokerId=0
# ASYNC_MASTER：master 写入内存后立即返回成功，异步刷盘和异步同步给 slave
# SYNC_MASTER：等所有 slave 确认收到后才返回成功，可靠性更高但延迟更大
brokerRole=ASYNC_MASTER
# ASYNC_FLUSH：消息写入 PageCache 即返回，由 OS 异步刷盘，性能好但宕机可能丢最近消息
# SYNC_FLUSH：每条消息强制刷盘后才返回，数据更安全但吞吐下降
flushDiskType=ASYNC_FLUSH

# ── 网络 ──────────────────────────────────────────────────────────────────────
# Broker 启动时向这两个 NameServer 注册自身路由信息
namesrvAddr=namesrv-1:9876;namesrv-2:9876
# Proxy 模式：brokerIP1 填容器 hostname，Proxy 在 Docker 内网直连 Broker
# 若填 host.docker.internal，宿主机进程可直连，但 Proxy 模式下不需要
brokerIP1=broker-master1
# Remoting 主端口，Producer/Consumer（或 Proxy）通过此端口与 Broker 通信
listenPort=10911
# HA 主从同步端口，slave 连接 master 的此端口拉取消息
haListenPort=10912

# ── Topic / SubscriptionGroup 自动创建 ───────────────────────────────────────
# 开发环境开启，生产环境建议关闭，改为手动创建 Topic 以防误操作
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# ── 消息存储 ──────────────────────────────────────────────────────────────────
# 每天凌晨 4 点清理过期消息文件
deleteWhen=04
# 消息文件保留 48 小时，超时自动删除（无论是否消费完）
fileReservedTime=48
# 消息存储根目录（容器内路径，由 volumes 挂载到宿主机持久化）
storePathRootDir=/home/rocketmq/store
# CommitLog 文件路径，所有 Topic 的消息顺序写入同一个 CommitLog
storePathCommitLog=/home/rocketmq/store/commitlog
