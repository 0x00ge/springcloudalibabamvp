# ============================================================================
# RocketMQ Broker 配置文件 - broker-group2 主节点（Master）
# ============================================================================
#
# 角色说明：
#   - 此节点为 broker-group2 的主节点（brokerId=0）
#   - 与 broker-group1 并行工作，共同分担集群流量
#   - 多个 Broker 组可以提高系统吞吐量和可用性
#   - Topic 的多个队列会分布在不同的 Broker 组上
#
# ============================================================================


# ============================================================================
# 一、集群与节点身份配置
# ============================================================================

brokerClusterName=DefaultCluster

# Broker 组名称
# - 与 broker-group1 不同，表示这是另一个独立的主从组
# - 不同组之间独立工作，互不影响
brokerName=broker-group2

brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH


# ============================================================================
# 二、网络配置
# ============================================================================

namesrvAddr=namesrv-1:9876
brokerIP1=broker-master2

# 端口配置
# - 必须与 broker-group1 的端口错开，避免冲突
# - Master1: 10911/10912
# - Master2: 10931/10932（+20）
listenPort=10931
haListenPort=10932


# ============================================================================
# 三、Topic 和消费组自动创建
# ============================================================================

autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true


# ============================================================================
# 四、消息存储配置
# ============================================================================

deleteWhen=04
fileReservedTime=48
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog


# ============================================================================
# 多 Broker 组的作用
# ============================================================================
#
# 1. 负载均衡
#    - Topic 的队列分布在多个 Broker 上
#    - 例如：8 个队列，4 个在 Master1，4 个在 Master2
#    - Producer 并发写入不同 Broker，提高吞吐量
#
# 2. 故障隔离
#    - broker-group1 宕机时，broker-group2 仍可正常服务
#    - 部分队列不可用，但系统整体仍可工作
#
# 3. 水平扩展
#    - 可以动态添加更多 Broker 组（broker-group3, broker-group4...）
#    - 新增的 Broker 会承载新创建的队列
#
# ============================================================================
