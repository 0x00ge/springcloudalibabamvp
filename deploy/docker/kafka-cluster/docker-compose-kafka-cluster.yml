# ============================================================================
# Kafka 本地开发集群 - Docker Compose 配置文件（单节点 KRaft 模式）
# ============================================================================
#
# 架构说明：
#   本地开发使用 1 个 Kafka 节点同时承担 broker/controller 角色。
#   宿主机应用通过 127.0.0.1:9092 访问 Kafka。
#
# Web 控制台：
#   http://127.0.0.1:8083
#
# ============================================================================

services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: mvp-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      TZ: Asia/Shanghai
    volumes:
      - /Users/zhongtao/.my_docker/kafka-cluster/kafka/data:/tmp/kafka-logs
    networks:
      - mvp-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: mvp-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      TZ: Asia/Shanghai
    networks:
      - mvp-network

networks:
  mvp-network:
    name: mvp-network
    external: true
