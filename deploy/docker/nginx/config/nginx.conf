# 本地开发为了方便观察轮询效果，先固定 1 个 worker。
# 如果使用 auto，多个 worker 会各自维护轮询状态，低频请求时可能看起来总是先打到 8001。
# 生产环境可以再改回 auto，提高多核利用率。
worker_processes 1;

events {
    # 每个 worker 允许的最大连接数。
    worker_connections 2048;
}

http {
    # Gateway 暂时运行在宿主机，不在 Docker 中。
    # Nginx 容器内访问宿主机不能写 127.0.0.1，因为那会指向 Nginx 容器自己。
    # 使用 docker-compose.yml 中 extra_hosts 固定的 host.docker.internal 访问宿主机。
    # 不写 Docker Desktop 网关 IP，避免网络环境变化或 Docker 网关变化后需要手工改配置。
    upstream mvp_gateway_cluster {
        # 负载均衡策略说明：
        #
        # 方案 A：默认轮询，当前启用。
        # Nginx upstream 不写任何策略指令时，就是轮询转发。

        #
        # 方案 B：最少连接，暂时关闭。
        # 优先转发给当前连接数更少的 gateway 实例。
        # 后续如果要启用最少连接，再放开下面这一行。
        # least_conn;

        # 宿主机 gateway 实例 1：启动端口 8001。
        server host.docker.internal:8001 max_fails=3 fail_timeout=10s;

        # 宿主机 gateway 实例 2：启动端口 8002。
        server host.docker.internal:8002 max_fails=3 fail_timeout=10s;

        # 本地验证轮询时先关闭 upstream keepalive，避免复用同一个后端连接导致看起来像固定打到 8001。
        # 生产环境如果追求连接复用，可以再打开。
        # keepalive 32;
    }

    server {
        # Nginx 对外暴露的统一入口端口。
        # docker-compose.yml 会把宿主机 8000 映射到容器内 8000。
        listen 8000;
        server_name _;

        # Nginx 自身健康检查接口，不转发到 gateway。
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 ok;
        }

        # 所有业务请求都转发给宿主机上的 gateway 双实例。
        location / {
            proxy_pass http://mvp_gateway_cluster;
            proxy_http_version 1.1;
            # 本地验证轮询时关闭到 gateway 的长连接，确保每次请求都重新选择 upstream。
            # 生产环境如果重新打开 upstream keepalive，可以改成空字符串配合连接复用。
            proxy_set_header Connection close;

            # 保留原始请求信息，方便 gateway 和下游服务记录链路。
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 透传认证和会话信息，避免 JWT/Cookie 丢失。
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;

            # 连接 gateway 的超时时间。
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 当前 gateway 实例不可用时，自动尝试另一个实例。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # 调试用：返回本次 Nginx 实际选中的 gateway 节点，方便确认轮询是否生效。
            # 生产环境如果不希望暴露内部端口，可以删除这两个响应头。
            add_header X-Nginx-Upstream $upstream_addr always;
            add_header X-Nginx-Upstream-Status $upstream_status always;
        }
    }
}
