services:
  nginx:
    image: nginx:1.30-alpine
    container_name: mvp-nginx
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /Users/zhongtao/.my_docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mvp-network

networks:
  mvp-network:
    name: mvp-network
    external: true
