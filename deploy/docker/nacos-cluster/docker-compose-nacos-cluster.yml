x-nacos-cluster-common: &nacos-cluster-common
  image: nacos/nacos-server:v2.5.2 # 固定版本，避免 latest 自动升级导致不兼容。
  restart: unless-stopped # Docker 或宿主机重启后自动恢复；手动 down 后不会自动拉起。
  environment:
    MODE: cluster # 集群模式；standalone 表示单机模式。
    PREFER_HOST_MODE: hostname # 集群节点之间使用 hostname 互相发现。
    NACOS_SERVERS: nacos-1:8848 nacos-2:8848 nacos-3:8848 # 集群成员列表。
    SPRING_DATASOURCE_PLATFORM: mysql # 使用外部 MySQL 存储配置中心数据。
    MYSQL_SERVICE_HOST: host.docker.internal # 宿主机 MySQL 地址。
    MYSQL_SERVICE_PORT: "3306"
    MYSQL_SERVICE_DB_NAME: nacos_config
    MYSQL_SERVICE_USER: root
    MYSQL_SERVICE_PASSWORD: rootroot
    MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai # MySQL 8 兼容参数。
    NACOS_AUTH_ENABLE: false # 本地开发关闭鉴权。
    NACOS_AUTH_IDENTITY_KEY: mvpNacosIdentityKey # 关闭鉴权也保留身份键。
    NACOS_AUTH_IDENTITY_VALUE: mvpNacosIdentityValue # 关闭鉴权也保留身份值。
    NACOS_AUTH_TOKEN: TXZwTmFjb3NBdXRoVG9rZW5DaGFuZ2VNZTIwMjZNdXN0QmVMb25nRW5vdWdo # 生产环境需替换。
    JVM_XMS: 512m # 初始堆内存。
    JVM_XMX: 512m # 最大堆内存。
    JVM_XMN: 256m # 新生代大小。
    TIME_ZONE: Asia/Shanghai # 容器时区。
    TZ: Asia/Shanghai # 兼容部分镜像的时区变量。
  extra_hosts:
    - "host.docker.internal:host-gateway" # Linux 下映射宿主机网关。
  expose:
    - "7848" # Raft / 集群内部通信。
    - "8848" # HTTP / OpenAPI。
    - "9848" # gRPC client。
    - "9849" # gRPC server。
  networks:
    - mvp-network

services:
  nacos-1:
    <<: *nacos-cluster-common
    container_name: mvp-nacos-1
    hostname: nacos-1
    ports:
      - "8848:8848" # 主节点控制台入口：http://127.0.0.1:8848/nacos
      - "9848:9848" # 宿主机 Java 客户端 gRPC 端口。
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-1/logs:/home/nacos/logs # 日志持久化。
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-1/data:/home/nacos/data # 数据持久化。

  nacos-2:
    <<: *nacos-cluster-common
    container_name: mvp-nacos-2
    hostname: nacos-2
    ports:
      - "8849:8848" # 第二个节点 HTTP 端口。
      - "9849:9848" # 第二个节点 gRPC client 端口。
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-2/logs:/home/nacos/logs # 日志持久化。
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-2/data:/home/nacos/data # 数据持久化。

  nacos-3:
    <<: *nacos-cluster-common
    container_name: mvp-nacos-3
    hostname: nacos-3
    ports:
      - "8850:8848" # 第三个节点 HTTP 端口。
      - "9850:9848" # 第三个节点 gRPC client 端口。
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-3/logs:/home/nacos/logs # 日志持久化。
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-3/data:/home/nacos/data # 数据持久化。

networks:
  mvp-network:
    name: mvp-network
    external: true
