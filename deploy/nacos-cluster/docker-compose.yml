services:
  nacos-1:
    image: nacos/nacos-server:v2.5.2
    # container_name 是 Docker 容器名，方便 docker logs nacos-1 这种命令直接查看。
    container_name: nacos-1
    # hostname 是容器内部主机名，Nacos 集群会把它写入集群节点列表。
    hostname: nacos-1
    environment:
      # cluster 表示集群模式；集群模式必须连接外部 MySQL。
      MODE: cluster
      # 使用 hostname 互相发现节点，对应下面 NACOS_SERVERS 里的 nacos-1/nacos-2/nacos-3。
      PREFER_HOST_MODE: hostname
      # Nacos 集群成员列表。这里的名称来自同一个 Docker 网络内的服务名/hostname。
      NACOS_SERVERS: nacos-1:8848 nacos-2:8848 nacos-3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: host.docker.internal
      MYSQL_SERVICE_PORT: 3306
      # 启动前需要先创建并导入 Nacos MySQL 初始化脚本。
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: rootroot
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
      # JVM 内存。当前本机演示使用 512m，生产可按机器资源调大。
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TIME_ZONE: Asia/Shanghai
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-1/logs:/home/nacos/logs
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-1/data:/home/nacos/data
    networks:
      - nacos-cluster

  nacos-2:
    image: nacos/nacos-server:v2.5.2
    container_name: nacos-2
    hostname: nacos-2
    environment:
      MODE: cluster
      PREFER_HOST_MODE: hostname
      NACOS_SERVERS: nacos-1:8848 nacos-2:8848 nacos-3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: host.docker.internal
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: rootroot
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
      # JVM 内存配置。
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TIME_ZONE: Asia/Shanghai
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-2/logs:/home/nacos/logs
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-2/data:/home/nacos/data
    networks:
      - nacos-cluster

  nacos-3:
    image: nacos/nacos-server:v2.5.2
    container_name: nacos-3
    hostname: nacos-3
    environment:
      MODE: cluster
      PREFER_HOST_MODE: hostname
      NACOS_SERVERS: nacos-1:8848 nacos-2:8848 nacos-3:8848
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: host.docker.internal
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: rootroot
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
      # JVM 内存配置。
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TIME_ZONE: Asia/Shanghai
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-3/logs:/home/nacos/logs
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-3/data:/home/nacos/data
    networks:
      - nacos-cluster

  # Nginx 作为 Nacos 集群统一入口。
  # 项目访问 127.0.0.1:8848/9848 时，实际先进 Nginx，再由 Nginx 转发到 nacos-1/2/3。
  nginx-nacos:
    image: nginx:1.30-alpine
    container_name: nginx-nacos
    # 等三个 Nacos 容器启动后再启动 Nginx。
    # 注意：depends_on 只保证容器启动顺序，不保证 Nacos 已经完全就绪。
    depends_on:
      - nacos-1
      - nacos-2
      - nacos-3
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - /Users/zhongtao/.my_docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nacos-cluster

networks:
  nacos-cluster:
    name: nacos-cluster
