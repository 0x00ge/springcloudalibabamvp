# 自动按照容器可用 CPU 数量启动 worker 进程。
# 在 Docker 环境里通常不用手动写死数量，交给 Nginx 自动判断即可。
worker_processes auto;

events {
    # 每个 worker 允许的最大连接数。
    # 实际最大并发连接约等于 worker_processes * worker_connections。
    worker_connections 2048;
}

http {
    # 定义 Gateway 集群 upstream。
    #
    # 当前默认启用方案 A：Nginx 在 Docker 中，Gateway 运行在宿主机。
    # 如果你把 Gateway 也放进 Docker，再把方案 A 注释掉，打开下面的方案 B 即可。
    upstream mvp_gateway_cluster {
        # 负载均衡策略：优先把请求转发给当前连接数更少的 Gateway。
        # 对接口耗时不均匀的服务，least_conn 通常比默认轮询更平滑。
        least_conn;

        # 方案 A：Gateway 运行在宿主机，Nginx 运行在 Docker 容器中。
        #
        # 注意：这里不能写 127.0.0.1，因为在 Nginx 容器里 127.0.0.1 指的是 Nginx 容器自己。
        # Docker Desktop 中访问宿主机要使用 host.docker.internal。
        #
        # max_fails=3 表示 10 秒内失败 3 次后，Nginx 会暂时认为该节点不可用。
        # fail_timeout=10s 同时表示失败统计窗口和临时摘除时长。
        server host.docker.internal:8001 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8002 max_fails=3 fail_timeout=10s;

        # 方案 B：Gateway 也运行在 Docker 中。
        #
        # gateway-1、gateway-2 是 docker-compose.yml 中的服务名。
        # 同一个 Docker 网络内，Nginx 可以直接通过服务名访问对应容器。
        # 两个 Gateway 容器都监听内部端口 8000。
        #
        # 如果启用方案 B，请注释掉上面的 host.docker.internal 两行，并打开下面两行。
        # server gateway-1:8000 max_fails=3 fail_timeout=10s;
        # server gateway-2:8000 max_fails=3 fail_timeout=10s;

        # upstream 到 Gateway 的空闲长连接池大小。
        # 保持连接可以减少频繁创建 TCP 连接的开销。
        keepalive 32;
    }

    server {
        # Nginx 对外暴露的统一入口端口。
        # docker-compose.yml 会把宿主机 8000 映射到容器内 8000。
        listen 8000;

        # 匹配任意 Host。
        # 本地开发一般通过 127.0.0.1:8000 访问，不需要绑定具体域名。
        server_name _;

        # Nginx 自身健康检查接口。
        # 这个接口不会转发到 Gateway，只用于确认 Nginx 容器和配置是否正常。
        location = /nginx-health {
            # 健康检查访问频率可能较高，关闭访问日志可以减少无意义日志。
            access_log off;

            # 返回纯文本，方便 curl 或 Docker healthcheck 判断。
            default_type text/plain;
            return 200 ok;
        }

        # 其他所有请求都转发给 Gateway 集群。
        location / {
            # 把请求转发到上面定义的 upstream。
            proxy_pass http://mvp_gateway_cluster;

            # 使用 HTTP/1.1，配合 upstream keepalive 复用连接。
            proxy_http_version 1.1;

            # 明确使用 keep-alive，配合 upstream keepalive 复用到 Gateway 的连接。
            # 这里不用空字符串写法，避免部分 IDE 的 Nginx 语法插件误报。
            proxy_set_header Connection keep-alive;

            # 保留原始 Host，后端如果需要根据域名判断来源，可以拿到用户请求的 Host。
            proxy_set_header Host $host;

            # 记录直接连接 Nginx 的客户端 IP。
            proxy_set_header X-Real-IP $remote_addr;

            # 追加代理链路中的客户端 IP，后端可用于日志、审计或限流。
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 告诉后端原始请求协议是 http 还是 https。
            proxy_set_header X-Forwarded-Proto $scheme;

            # 透传 Authorization，避免 JWT、Bearer Token 等认证信息丢失。
            proxy_set_header Authorization $http_authorization;

            # 透传 Cookie，避免基于 Cookie 的状态或灰度标记丢失。
            proxy_set_header Cookie $http_cookie;

            # 连接 Gateway 的超时时间。
            # 3 秒内连不上 Gateway，就认为该节点不可用。
            proxy_connect_timeout 3s;

            # 向 Gateway 发送请求体的超时时间。
            # 上传文件或大请求体时可以按业务需要调大。
            proxy_send_timeout 60s;

            # 等待 Gateway 返回响应的超时时间。
            # 如果后端接口可能执行较久，需要相应调大。
            proxy_read_timeout 60s;

            # 当前 Gateway 无法连接时，自动尝试另一个节点。
            # error/timeout 表示网络错误或超时会触发重试。
            # http_502/http_503/http_504 表示网关类错误会触发重试。
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # 最多尝试 2 个节点。
            # 当前集群只有 gateway-1、gateway-2，所以这里正好允许失败后换另一个节点。
            proxy_next_upstream_tries 2;
        }
    }
}
