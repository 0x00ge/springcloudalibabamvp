# 自动按照容器可用 CPU 数量启动 worker 进程。
worker_processes auto;

events {
    # 每个 worker 允许的最大连接数。
    worker_connections 2048;
}

http {
    # Gateway 暂时运行在宿主机，不在 Docker 中。
    # Nginx 容器内访问宿主机不能写 127.0.0.1，因为那会指向 Nginx 容器自己。
    # Docker Desktop 和本 compose 的 extra_hosts 都支持使用 host.docker.internal 访问宿主机。
    upstream mvp_gateway_cluster {
        # 优先转发给当前连接数更少的 gateway 实例。
        least_conn;

        # 宿主机 gateway 实例 1：启动端口 8001。
        server host.docker.internal:8001 max_fails=3 fail_timeout=10s;

        # 宿主机 gateway 实例 2：启动端口 8002。
        server host.docker.internal:8002 max_fails=3 fail_timeout=10s;

        # 保持到 gateway 的空闲长连接，减少频繁创建 TCP 连接的开销。
        keepalive 32;
    }

    server {
        # Nginx 对外暴露的统一入口端口。
        # docker-compose.yml 会把宿主机 8000 映射到容器内 8000。
        listen 8000;
        server_name _;

        # Nginx 自身健康检查接口，不转发到 gateway。
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 ok;
        }

        # 所有业务请求都转发给宿主机上的 gateway 双实例。
        location / {
            proxy_pass http://mvp_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection keep-alive;

            # 保留原始请求信息，方便 gateway 和下游服务记录链路。
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 透传认证和会话信息，避免 JWT/Cookie 丢失。
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;

            # 连接 gateway 的超时时间。
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 当前 gateway 实例不可用时，自动尝试另一个实例。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
