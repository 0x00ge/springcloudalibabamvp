# 本 compose 只负责 Docker 内的基础设施：
# 1. Nacos 三节点集群；
# 2. RocketMQ 本地开发集群；
# 3. Nginx 作为对外统一入口，把请求转发到宿主机上的两个 gateway 实例。
#
# 注意：gateway-1、gateway-2 暂时不放进 Docker，需要在宿主机分别启动 8001、8002 端口。

x-nacos-common: &nacos-common
  image: nacos/nacos-server:v2.5.2
  restart: unless-stopped
  environment:
    # Nacos 集群模式，三个节点通过 Docker 网络内的 hostname 互相通信。
    MODE: cluster
    PREFER_HOST_MODE: hostname
    NACOS_SERVERS: nacos-1:8848 nacos-2:8848 nacos-3:8848

    # Nacos 集群使用宿主机已有 MySQL。
    # 在容器内不能用 127.0.0.1 访问宿主机 MySQL，因为 127.0.0.1 指的是当前容器自己。
    SPRING_DATASOURCE_PLATFORM: mysql
    MYSQL_SERVICE_HOST: host.docker.internal
    MYSQL_SERVICE_PORT: "3306"
    MYSQL_SERVICE_DB_NAME: nacos_config
    MYSQL_SERVICE_USER: root
    MYSQL_SERVICE_PASSWORD: rootroot
    MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai

    # 本地开发默认关闭 Nacos 鉴权；生产环境建议开启鉴权，并更换 identity/token。
    NACOS_AUTH_ENABLE: false
    NACOS_AUTH_IDENTITY_KEY: mvpNacosIdentityKey
    NACOS_AUTH_IDENTITY_VALUE: mvpNacosIdentityValue
    NACOS_AUTH_TOKEN: TXZwTmFjb3NBdXRoVG9rZW5DaGFuZ2VNZTIwMjZNdXN0QmVMb25nRW5vdWdo

    # 本地开发的 JVM 配置，机器内存紧张时可以继续调小。
    JVM_XMS: 512m
    JVM_XMX: 512m
    JVM_XMN: 256m
    TIME_ZONE: Asia/Shanghai
  extra_hosts:
    # Docker Desktop 默认支持 host.docker.internal；
    # Linux Docker 通过 host-gateway 映射到宿主机网关地址。
    - "host.docker.internal:host-gateway"
  expose:
    # 8848: Nacos HTTP 控制台/API；
    # 9848: Nacos 客户端 gRPC；
    # 9849/7848: Nacos 节点内部通信。
    - "7848"
    - "8848"
    - "9848"
    - "9849"
  networks:
    - mvp-network

x-rocketmq-common: &rocketmq-common
  image: apache/rocketmq:5.3.4
  restart: unless-stopped
  environment:
    # 本地开发压低内存占用；生产环境需要按消息量和机器规格重新设置。
    JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    TZ: Asia/Shanghai
  networks:
    - mvp-network

services:
  nacos-1:
    <<: *nacos-common
    container_name: mvp-nacos-1
    hostname: nacos-1
    ports:
      # 宿主机访问第 1 个 Nacos 节点：http://127.0.0.1:8848/nacos/
      - "8848:8848"
      # Nacos 客户端访问 127.0.0.1:8848 时，会自动使用 9848 做 gRPC 通信。
      - "9848:9848"
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-1/logs:/home/nacos/logs
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-1/data:/home/nacos/data

  nacos-2:
    <<: *nacos-common
    container_name: mvp-nacos-2
    hostname: nacos-2
    ports:
      # 宿主机访问第 2 个 Nacos 节点：http://127.0.0.1:8849/nacos/
      # 容器内仍然监听 8848，只是映射到宿主机 8849，避免端口冲突。
      - "8849:8848"
      # 对应 8849 的客户端 gRPC 端口是 9849，映射到容器内 9848。
      - "9849:9848"
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-2/logs:/home/nacos/logs
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-2/data:/home/nacos/data

  nacos-3:
    <<: *nacos-common
    container_name: mvp-nacos-3
    hostname: nacos-3
    ports:
      # 宿主机访问第 3 个 Nacos 节点：http://127.0.0.1:8850/nacos/
      - "8850:8848"
      # 对应 8850 的客户端 gRPC 端口是 9850，映射到容器内 9848。
      - "9850:9848"
    volumes:
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-3/logs:/home/nacos/logs
      - /Users/zhongtao/.my_docker/nacos-cluster/nacos-3/data:/home/nacos/data

  rocketmq-namesrv-1:
    <<: *rocketmq-common
    container_name: mvp-rocketmq-namesrv-1
    hostname: rocketmq-namesrv-1
    command: sh mqnamesrv
    ports:
      # 宿主机访问第 1 个 RocketMQ NameServer。
      - "9876:9876"
    volumes:
      - /Users/zhongtao/.my_docker/rocketmq-cluster/namesrv-1/logs:/home/rocketmq/logs

  rocketmq-namesrv-2:
    <<: *rocketmq-common
    container_name: mvp-rocketmq-namesrv-2
    hostname: rocketmq-namesrv-2
    command: sh mqnamesrv
    ports:
      # 宿主机访问第 2 个 RocketMQ NameServer。
      - "9877:9876"
    volumes:
      - /Users/zhongtao/.my_docker/rocketmq-cluster/namesrv-2/logs:/home/rocketmq/logs

  rocketmq-broker-a:
    <<: *rocketmq-common
    container_name: mvp-rocketmq-broker-a
    hostname: rocketmq-broker-a
    depends_on:
      - rocketmq-namesrv-1
      - rocketmq-namesrv-2
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      NAMESRV_ADDR: rocketmq-namesrv-1:9876;rocketmq-namesrv-2:9876
      TZ: Asia/Shanghai
    command: sh mqbroker -c /home/rocketmq/conf/broker-a.conf
    ports:
      # 10911: Broker remoting；10909: VIP 通道；10912: HA 通道。
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    extra_hosts:
      # Broker 注册给宿主机 Java 进程访问的地址使用 host.docker.internal。
      - "host.docker.internal:host-gateway"
    volumes:
      - /Users/zhongtao/.my_docker/rocketmq-cluster/conf/broker-a.conf:/home/rocketmq/conf/broker-a.conf:ro
      - /Users/zhongtao/.my_docker/rocketmq-cluster/broker-a/store:/home/rocketmq/store
      - /Users/zhongtao/.my_docker/rocketmq-cluster/broker-a/logs:/home/rocketmq/logs

  rocketmq-broker-b:
    <<: *rocketmq-common
    container_name: mvp-rocketmq-broker-b
    hostname: rocketmq-broker-b
    depends_on:
      - rocketmq-namesrv-1
      - rocketmq-namesrv-2
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      NAMESRV_ADDR: rocketmq-namesrv-1:9876;rocketmq-namesrv-2:9876
      TZ: Asia/Shanghai
    command: sh mqbroker -c /home/rocketmq/conf/broker-b.conf
    ports:
      # broker-b 使用另一组端口，避免和 broker-a 冲突。
      - "10919:10919"
      - "10921:10921"
      - "10922:10922"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Users/zhongtao/.my_docker/rocketmq-cluster/conf/broker-b.conf:/home/rocketmq/conf/broker-b.conf:ro
      - /Users/zhongtao/.my_docker/rocketmq-cluster/broker-b/store:/home/rocketmq/store
      - /Users/zhongtao/.my_docker/rocketmq-cluster/broker-b/logs:/home/rocketmq/logs

  rocketmq-proxy:
    <<: *rocketmq-common
    container_name: mvp-rocketmq-proxy
    hostname: rocketmq-proxy
    depends_on:
      - rocketmq-namesrv-1
      - rocketmq-namesrv-2
      - rocketmq-broker-a
      - rocketmq-broker-b
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
      NAMESRV_ADDR: rocketmq-namesrv-1:9876;rocketmq-namesrv-2:9876
      TZ: Asia/Shanghai
    command: sh mqproxy
    ports:
      # RocketMQ 5.x proxy 端口，新版 Java SDK 通常连接 8081。
      - "8080:8080"
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Users/zhongtao/.my_docker/rocketmq-cluster/proxy/logs:/home/rocketmq/logs

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    container_name: mvp-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv-1
      - rocketmq-namesrv-2
      - rocketmq-broker-a
      - rocketmq-broker-b
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv-1:9876;rocketmq-namesrv-2:9876"
      TZ: Asia/Shanghai
    ports:
      # Dashboard 容器内端口是 8080；宿主机用 8088，避免和 RocketMQ Proxy 的 8080 冲突。
      - "8088:8080"
    networks:
      - mvp-network

  nginx:
    image: nginx:1.30-alpine
    container_name: mvp-nginx
    restart: unless-stopped
    ports:
      # 对外统一入口。
      # 前端和外部调用访问 127.0.0.1:8000，再由 Nginx 转发到宿主机 gateway 8001/8002。
      - "8000:8000"
    volumes:
      # 左边是本 compose 同目录下的 nginx.conf，右边是容器内 Nginx 实际读取的配置文件。
      # 这样修改 deploy/docker-dev/nginx.conf 后，重启 Nginx 容器即可生效。
      - /Users/zhongtao/.my_docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Nginx 在容器里访问宿主机 gateway 时，要使用 host.docker.internal。
      - "host.docker.internal:host-gateway"
    networks:
      - mvp-network

networks:
  mvp-network:
    name: mvp-network
    driver: bridge
