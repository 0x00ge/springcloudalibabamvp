events {
    worker_connections 1024;
}

http {
    upstream mvp_gateway_cluster {
        # Nginx 跑在 Docker 容器里时，访问宿主机 Java 进程要使用 host.docker.internal。
        server host.docker.internal:8001 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8002 max_fails=3 fail_timeout=10s;
    }

    server {
        # 本地统一入口。前端仍然访问 127.0.0.1:8000。
        listen 8000;

        location / {
            proxy_pass http://mvp_gateway_cluster;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 保留原始请求信息，方便 gateway 和下游服务获取真实调用来源。
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 认证相关头和 Cookie 必须透传，否则登录态会丢失。
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
