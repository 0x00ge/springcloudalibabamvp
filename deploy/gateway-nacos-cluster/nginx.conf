worker_processes auto;

events {
    worker_connections 2048;
}

http {
    upstream mvp_gateway_cluster {
        # 两个 Gateway 容器都监听内部端口 8000。
        least_conn;
        server gateway-1:8000 max_fails=3 fail_timeout=10s;
        server gateway-2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://mvp_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;

            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 当前 Gateway 无法连接时，自动尝试另一个节点。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
