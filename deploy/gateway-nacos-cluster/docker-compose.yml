x-nacos-common: &nacos-common
  image: nacos/nacos-server:v2.5.2
  restart: unless-stopped
  environment:
    # 三个 Nacos 节点通过 Docker 服务名直接组成集群。
    MODE: cluster
    PREFER_HOST_MODE: hostname
    NACOS_SERVERS: nacos-1:8848 nacos-2:8848 nacos-3:8848

    # Nacos 集群连接宿主机现有 MySQL。
    SPRING_DATASOURCE_PLATFORM: mysql
    MYSQL_SERVICE_HOST: host.docker.internal
    MYSQL_SERVICE_PORT: "3306"
    MYSQL_SERVICE_DB_NAME: nacos_config
    MYSQL_SERVICE_USER: root
    MYSQL_SERVICE_PASSWORD: rootroot
    MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai

    # 本地演示默认关闭鉴权；生产环境应开启并更换密钥。
    NACOS_AUTH_ENABLE: false
    NACOS_AUTH_IDENTITY_KEY: mvpNacosIdentityKey
    NACOS_AUTH_IDENTITY_VALUE: mvpNacosIdentityValue
    NACOS_AUTH_TOKEN: TXZwTmFjb3NBdXRoVG9rZW5DaGFuZ2VNZTIwMjZNdXN0QmVMb25nRW5vdWdo

    JVM_XMS: 512m
    JVM_XMX: 512m
    JVM_XMN: 256m
    TIME_ZONE: Asia/Shanghai
  extra_hosts:
    # Docker Desktop 自动提供该域名；该配置同时兼容 Linux Docker。
    - "host.docker.internal:host-gateway"
  expose:
    # 8848: HTTP；9848: 客户端 gRPC；7848/9849: Nacos 节点内部通信。
    - "7848"
    - "8848"
    - "9848"
    - "9849"
  networks:
    - mvp-cluster

x-gateway-common: &gateway-common
  image: eclipse-temurin:17-jre-alpine
  restart: unless-stopped
  working_dir: /app
  environment:
    SERVER_PORT: "8000"
    SPRING_PROFILES_ACTIVE: dev

    # Gateway 不经过 Nginx，直接连接三个 Nacos 节点。
    SPRING_CLOUD_NACOS_SERVER_ADDR: nacos-1:8848,nacos-2:8848,nacos-3:8848
    SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos-1:8848,nacos-2:8848,nacos-3:8848
    SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos-1:8848,nacos-2:8848,nacos-3:8848

    JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
    TZ: Asia/Shanghai
  volumes:
    # 启动前先执行：mvn -pl gateway -am -DskipTests package
    - ../../gateway/target/gateway-0.0.1-SNAPSHOT.jar:/app/gateway.jar:ro
  depends_on:
    - nacos-1
    - nacos-2
    - nacos-3
  expose:
    - "8000"
  networks:
    - mvp-cluster

services:
  nacos-1:
    <<: *nacos-common
    container_name: mvp-nacos-1
    hostname: nacos-1
    ports:
      # 只暴露第一个节点，供宿主机打开 Nacos 控制台。
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-1-logs:/home/nacos/logs
      - nacos-1-data:/home/nacos/data

  nacos-2:
    <<: *nacos-common
    container_name: mvp-nacos-2
    hostname: nacos-2
    volumes:
      - nacos-2-logs:/home/nacos/logs
      - nacos-2-data:/home/nacos/data

  nacos-3:
    <<: *nacos-common
    container_name: mvp-nacos-3
    hostname: nacos-3
    volumes:
      - nacos-3-logs:/home/nacos/logs
      - nacos-3-data:/home/nacos/data

  gateway-1:
    <<: *gateway-common
    container_name: mvp-gateway-1
    hostname: gateway-1
    command:
      - /bin/sh
      - -c
      - >
        exec java -jar /app/gateway.jar
        --spring.cloud.nacos.discovery.ip=$$(hostname -i | awk '{print $$1}')

  gateway-2:
    <<: *gateway-common
    container_name: mvp-gateway-2
    hostname: gateway-2
    command:
      - /bin/sh
      - -c
      - >
        exec java -jar /app/gateway.jar
        --spring.cloud.nacos.discovery.ip=$$(hostname -i | awk '{print $$1}')

  nginx-gateway:
    image: nginx:1.30-alpine
    container_name: mvp-nginx-gateway
    restart: unless-stopped
    depends_on:
      - gateway-1
      - gateway-2
    ports:
      # 前端和外部调用只访问这个统一入口。
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mvp-cluster

networks:
  mvp-cluster:
    name: mvp-cluster
    driver: bridge

volumes:
  nacos-1-logs:
  nacos-1-data:
  nacos-2-logs:
  nacos-2-data:
  nacos-3-logs:
  nacos-3-data:
