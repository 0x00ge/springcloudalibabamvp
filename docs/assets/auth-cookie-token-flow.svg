<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000">
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 46px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 25px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 23px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .packet { font: 400 16px Menlo, Monaco, Consolas, monospace; fill: #334155; }
      .badge { font: 700 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: white; }
      .browser { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .backend { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
      .card { fill: white; stroke: #cbd5e1; stroke-width: 2; }
      .pinia { fill: #eef2ff; stroke: #818cf8; stroke-width: 2; }
      .cookie { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .gateway { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; }
      .service { fill: #e0f2fe; stroke: #0ea5e9; stroke-width: 2; }
      .redis { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      .row-login { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
      .row-business { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 2; }
      .row-refresh { fill: #fffbeb; stroke: #fde68a; stroke-width: 2; }
      .row-logout { fill: #fef2f2; stroke: #fecaca; stroke-width: 2; }
    </style>
  </defs>

  <rect width="2000" height="2000" fill="#f8fafc"/>
  <text x="70" y="78" class="title">HttpOnly Cookie + 双 Token + Redis 认证流程图</text>
  <text x="70" y="120" class="subtitle">核心：accessToken 给前端 JS 存 Pinia/内存；refreshToken 通过 Set-Cookie 进入浏览器 Cookie Jar，前端 JS 不能读取</text>

  <rect x="70" y="165" width="900" height="260" rx="26" class="browser"/>
  <text x="105" y="213" class="lane-title">浏览器位置</text>

  <rect x="105" y="245" width="245" height="130" rx="18" class="card"/>
  <text x="130" y="285" class="box-title">前端 JS</text>
  <text x="130" y="320" class="box-text">读响应体</text>
  <text x="130" y="352" class="box-text">发 HTTP 请求</text>

  <rect x="395" y="245" width="245" height="130" rx="18" class="pinia"/>
  <text x="420" y="285" class="box-title">Pinia / 内存</text>
  <text x="420" y="320" class="box-text">accessToken</text>
  <text x="420" y="352" class="box-text">userInfo</text>

  <rect x="685" y="245" width="245" height="130" rx="18" class="cookie"/>
  <text x="710" y="285" class="box-title">Cookie Jar</text>
  <text x="710" y="320" class="box-text">mvp_refresh_token</text>
  <text x="710" y="352" class="box-text">HttpOnly，JS 读不到</text>

  <path d="M350 310 L392 310" fill="none" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="354" y="295" class="small">写入</text>

  <rect x="1030" y="165" width="900" height="260" rx="26" class="backend"/>
  <text x="1065" y="213" class="lane-title">后端位置</text>

  <rect x="1065" y="245" width="230" height="130" rx="18" class="gateway"/>
  <text x="1090" y="285" class="box-title">gateway</text>
  <text x="1090" y="320" class="box-text">白名单</text>
  <text x="1090" y="352" class="box-text">校验 accessToken</text>

  <rect x="1340" y="245" width="250" height="130" rx="18" class="service"/>
  <text x="1365" y="285" class="box-title">service-user-0</text>
  <text x="1365" y="320" class="box-text">签发 token</text>
  <text x="1365" y="352" class="box-text">Set-Cookie / 读 Cookie</text>

  <rect x="1635" y="245" width="250" height="130" rx="18" class="redis"/>
  <text x="1660" y="285" class="box-title">Redis</text>
  <text x="1660" y="320" class="box-text">refresh 会话</text>
  <text x="1660" y="352" class="box-text">access 黑名单</text>

  <path d="M1295 310 L1338 310" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1590 310 L1633 310" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="70" y="470" width="1860" height="310" rx="26" class="row-login"/>
  <rect x="105" y="508" width="120" height="38" rx="19" fill="#1d4ed8"/>
  <text x="134" y="533" class="badge">1 登录</text>
  <text x="260" y="534" class="box-title">后端把两个 token 分开给：accessToken 给 JS，refreshToken 给浏览器 Cookie Jar</text>

  <rect x="120" y="585" width="430" height="130" rx="18" class="card"/>
  <text x="150" y="625" class="box-title">请求</text>
  <text x="150" y="660" class="packet">POST /api/user/login</text>
  <text x="150" y="692" class="packet">body: loginName + password</text>

  <rect x="725" y="585" width="430" height="130" rx="18" class="service"/>
  <text x="755" y="625" class="box-title">service-user-0</text>
  <text x="755" y="660" class="box-text">校验账号密码，生成 accessToken + refreshToken</text>
  <text x="755" y="692" class="box-text">refreshToken 写入 Redis</text>

  <rect x="1330" y="560" width="520" height="175" rx="18" class="card"/>
  <text x="1360" y="600" class="box-title">响应</text>
  <text x="1360" y="635" class="packet">JSON: data.accessToken = aaa.bbb.ccc</text>
  <text x="1360" y="667" class="packet">JSON: data.refreshToken = null</text>
  <text x="1360" y="699" class="packet">Set-Cookie: mvp_refresh_token=xxx; HttpOnly</text>

  <path d="M550 650 L722 650" fill="none" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="586" y="632" class="small">经 gateway 转发</text>
  <path d="M1330 635 C1030 520, 700 485, 520 585" fill="none" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="760" y="515" class="small">响应体 accessToken → JS → Pinia</text>
  <path d="M1330 700 C1060 800, 875 800, 800 735" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="940" y="805" class="small">Set-Cookie → Cookie Jar，JS 不能读</text>

  <rect x="70" y="820" width="1860" height="280" rx="26" class="row-business"/>
  <rect x="105" y="858" width="160" height="38" rx="19" fill="#16a34a"/>
  <text x="130" y="883" class="badge">2 业务访问</text>
  <text x="300" y="884" class="box-title">accessToken 没过期：业务鉴权只看 Authorization</text>

  <rect x="120" y="940" width="480" height="105" rx="18" class="card"/>
  <text x="150" y="980" class="packet">GET /api/**</text>
  <text x="150" y="1012" class="packet">Authorization: Bearer aaa.bbb.ccc</text>

  <rect x="760" y="920" width="420" height="145" rx="18" class="gateway"/>
  <text x="790" y="960" class="box-title">gateway</text>
  <text x="790" y="995" class="box-text">校验签名、typ=access、exp</text>
  <text x="790" y="1027" class="box-text">查询 Redis 黑名单</text>

  <rect x="1340" y="940" width="420" height="105" rx="18" class="card"/>
  <text x="1370" y="980" class="packet">Cookie 可能自动携带</text>
  <text x="1370" y="1012" class="packet">但业务鉴权不使用 Cookie</text>

  <path d="M600 992 L758 992" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1180 992 L1338 992" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="70" y="1140" width="1860" height="330" rx="26" class="row-refresh"/>
  <rect x="105" y="1178" width="160" height="38" rx="19" fill="#d97706"/>
  <text x="130" y="1203" class="badge">3 刷新</text>
  <text x="300" y="1204" class="box-title">accessToken 过期或内存丢失：/auth/refresh 靠 HttpOnly Cookie 续签</text>

  <rect x="120" y="1265" width="520" height="125" rx="18" class="card"/>
  <text x="150" y="1305" class="packet">POST /api/auth/refresh</text>
  <text x="150" y="1337" class="packet">body: 空</text>
  <text x="150" y="1369" class="packet">Cookie: mvp_refresh_token=xxx.yyy.zzz</text>

  <rect x="770" y="1250" width="430" height="155" rx="18" class="service"/>
  <text x="800" y="1290" class="box-title">service-user-0</text>
  <text x="800" y="1325" class="box-text">从 Cookie 读取 refreshToken</text>
  <text x="800" y="1357" class="box-text">校验 JWT + Redis，轮换 refreshToken</text>

  <rect x="1360" y="1235" width="470" height="185" rx="18" class="card"/>
  <text x="1390" y="1275" class="box-title">响应</text>
  <text x="1390" y="1310" class="packet">JSON: new accessToken</text>
  <text x="1390" y="1342" class="packet">Set-Cookie: new mvp_refresh_token</text>
  <text x="1390" y="1374" class="packet">旧 Cookie 被覆盖</text>

  <path d="M640 1328 L768 1328" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M1200 1328 L1358 1328" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M1360 1310 C1030 1160, 710 1160, 510 1265" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="730" y="1165" class="small">new accessToken → Pinia/内存</text>

  <rect x="70" y="1510" width="1860" height="300" rx="26" class="row-logout"/>
  <rect x="105" y="1548" width="140" height="38" rx="19" fill="#dc2626"/>
  <text x="135" y="1573" class="badge">4 登出</text>
  <text x="285" y="1574" class="box-title">登出：清前端内存、删 Cookie、删 Redis refreshToken、拉黑 accessToken</text>

  <rect x="120" y="1640" width="500" height="110" rx="18" class="card"/>
  <text x="150" y="1680" class="packet">POST /api/user/logout</text>
  <text x="150" y="1712" class="packet">Authorization: Bearer accessToken</text>

  <rect x="760" y="1625" width="450" height="140" rx="18" class="redis"/>
  <text x="790" y="1665" class="box-title">Redis</text>
  <text x="790" y="1700" class="box-text">删除 refreshToken 会话</text>
  <text x="790" y="1732" class="box-text">写入 accessToken 黑名单</text>

  <rect x="1360" y="1625" width="470" height="140" rx="18" class="card"/>
  <text x="1390" y="1665" class="box-title">响应和浏览器状态</text>
  <text x="1390" y="1700" class="packet">Set-Cookie: Max-Age=0</text>
  <text x="1390" y="1732" class="packet">Pinia/内存清空</text>

  <path d="M620 1695 L758 1695" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>
  <path d="M1210 1695 L1358 1695" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>

  <rect x="70" y="1850" width="1860" height="95" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="105" y="1890" class="box-title">一句话记忆</text>
  <text x="300" y="1890" class="box-text">accessToken 是给 JS 临时访问业务接口的；refreshToken 是给浏览器自动带去刷新接口的，JS 看不到，Redis 决定它是否有效。</text>
</svg>
