server:
  port: 8002 # gateway 对外暴露端口，前端和外部调用统一访问这里

spring:
  application:
    name: mvp-gateway-1 # 注册到 Nacos 的服务名
  profiles:
    active: dev # 默认使用开发环境配置；生产环境可以通过启动参数覆盖
    include: route # 额外加载 application-route.yml 中的路由规则
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.yml # 可选导入 Nacos 中的 gateway-dev.yml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]': # 对所有路径生效
            allowedOriginPatterns: '*' # 允许所有来源，配合 allowCredentials 使用 pattern
            allowedMethods: '*' # 允许所有 HTTP 方法
            allowedHeaders: '*' # 允许所有请求头
            allowCredentials: true # 允许携带 Cookie、Authorization 等凭证
      httpclient:
        connect-timeout: 3000 # 后端连接超时时间，单位毫秒
        response-timeout: 5s # 后端响应超时时间
    nacos:
      server-addr: 127.0.0.1:8848,127.0.0.1:8849,127.0.0.1:8850 # 宿主机访问 Docker Nacos 三节点集群
      discovery:
        ip: 127.0.0.1

jwt:
  # demo 密钥，需要和 service-user-0 保持一致。
  secret: mvp-jwt-demo-secret-key-change-me-please-2026
  access-token-seconds: 30
  refresh-token-seconds: 60

auth:
  whitelist:
    - /auth/register
    - /auth/login
    - /auth/refresh
  blacklist-key-prefix: 'auth:blacklist:'
