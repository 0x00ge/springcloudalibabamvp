server:
  port: 8200

spring:
  application:
    name: service-user-0
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active}.yml
  profiles:
    active: dev
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/mvp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
          username: root
          password: rootroot
        slave1:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3307/mvp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
          username: root
          password: rootroot
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848,127.0.0.1:8849,127.0.0.1:8850
      discovery:
        ip: 127.0.0.1

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  # demo 密钥。真实项目请放到配置中心或环境变量中，并保证足够长、定期轮换。
  secret: mvp-jwt-demo-secret-key-change-me-please-2026
  access-token-seconds: 30
  refresh-token-seconds: 60

auth:
  blacklist-key-prefix: 'auth:blacklist:'
  refresh-key-prefix: 'auth:refresh:'
  register-sms-code-key-prefix: 'auth:register:sms:'
  register-sms-code-seconds: 300
  refresh-token-cookie-name: refreshToken
  refresh-token-cookie-path: /
  refresh-token-cookie-same-site: Lax
  refresh-token-cookie-secure: false
