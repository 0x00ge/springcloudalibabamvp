server:
  port: 8080

spring:
  application:
    name: rocketmq-demo

rocketmq:
  # Proxy 模式：应用连 Proxy gRPC 端口（8081），不直连 NameServer
  name-server: 127.0.0.1:8081
  producer:
    group: demo-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

logging:
  level:
    com.demo: DEBUG
    org.apache.rocketmq: INFO
