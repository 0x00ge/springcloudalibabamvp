server:
  port: 8090  # 改为 8090，避免与其他服务冲突

spring:
  application:
    name: rocketmq-demo

rocketmq:
  # 直连模式：应用通过 NameServer 获取 Broker 地址，然后直连 Broker
  # 这是最稳定可靠的方式，适合开发和生产环境
  name-server: 127.0.0.1:9876

  # 生产者配置
  producer:
    group: demo-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

logging:
  level:
    com.demo: DEBUG
    org.apache.rocketmq: INFO