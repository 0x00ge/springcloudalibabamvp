server:
  port: 8090  # 改为 8090，避免与其他服务冲突

spring:
  application:
    name: rocketmq-demo

rocketmq:
  # 纯 Proxy 模式：应用只连 Proxy，不直连 Broker
  # 注意：rocketmq-spring-boot-starter 2.3.x 要求 name-server 必填
  # 但实际连接时使用 proxy.endpoints，name-server 只是占位
  name-server: 127.0.0.1:9876

  # 生产者配置（走 Remoting 协议，需要通过 NameServer）
  producer:
    group: demo-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

logging:
  level:
    com.demo: DEBUG
    org.apache.rocketmq: INFO